      <line x1="-18" y1="31.2" x2="-36" y2="62" stroke="#bef264" stroke-opacity="0.45" stroke-width="2.5"/>
      <circle cx="-39" cy="69" r="7" fill="#bef264" fill-opacity="0.55"/>
